name: Pages environment inspection
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read existing Environment and deployment branch policies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/environments/github-pages > environment.json
          gh api repos/${{ github.repository }}/environments/github-pages/deployment-branch-policies > branch-policies.json
          jq '{name, protection_rules, deployment_branch_policy}' environment.json
          jq '.branch_policies' branch-policies.json
      - uses: actions/upload-artifact@v6
        with:
          name: pages-environment-inspection
          path: |
            environment.json
            branch-policies.json
          retention-days: 14
