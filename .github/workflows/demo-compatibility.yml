name: Scoped development checks
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Explicit manual suite (never a normal development gate)
        type: choice
        required: true
        default: regression
        options: [regression, diagnostics]
permissions:
  contents: read
jobs:
  frontend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pip install ruff==0.9.10
      - name: Check only changed sources and credentials
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/check_changed_sources.py
  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pip install poetry==2.2.1
      - run: poetry install --no-interaction
      - run: npm ci
        working-directory: ui_web
      - name: Manual business regression
        if: inputs.suite == 'regression'
        run: |
          poetry run pytest -q
          poetry run pytest ui_web/tests/tooling -q
          npm --prefix ui_web test
      - name: Manual diagnostics
        if: inputs.suite == 'diagnostics'
        run: |
          poetry run pytest --diagnostics -m diagnostic data_lake data_snapshot/tests market_research/tests market_backtesting/tests market_statistics/tests ui_http/tests ui_web/tests/deploy -q
          npm --prefix ui_web run test:diagnostics
          npm --prefix ui_web run test:public-safety
