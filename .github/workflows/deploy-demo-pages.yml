name: Portfolio Pages release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  compatibility:
    uses: ./.github/workflows/demo-compatibility.yml
  release-build:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
        working-directory: ui_web
      - run: node scripts/public_admission_status.mjs
        id: admission
        working-directory: ui_web
      - name: Inspect existing protected Pages environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/environments/github-pages > environment.json
          gh api repos/${{ github.repository }}/environments/github-pages/deployment-branch-policies > branch-policies.json
          node ui_web/scripts/check_pages_environment.mjs environment.json branch-policies.json
      - name: Retain reviewed V1 recovery artifact
        run: |
          mkdir -p rollback/site
          node ui_web/scripts/extract_v1_rollback.mjs rollback/site
          node ui_web/scripts/verify_v1_rollback.mjs rollback/site
      - uses: actions/upload-artifact@v6
        with:
          name: portfolio-v1-rollback
          path: rollback
          retention-days: 90
      - name: Build admitted public V2
        if: steps.admission.outputs.admitted == 'true'
        run: npm run demo:build:public
        working-directory: ui_web
      - name: Browser prerequisite
        if: steps.admission.outputs.admitted == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: ui_web
      - name: Verify actual built static site
        if: steps.admission.outputs.admitted == 'true'
        run: node scripts/public_demo_browser.mjs
        working-directory: ui_web
      - name: Verify exact scanned bytes
        if: steps.admission.outputs.admitted == 'true'
        run: node scripts/verify_public_artifact.mjs ${{ github.sha }}
        working-directory: ui_web
      - uses: actions/upload-artifact@v6
        if: steps.admission.outputs.admitted == 'true'
        with:
          name: portfolio-public-${{ github.sha }}
          path: ui_web/.build/demo
          include-hidden-files: true
          retention-days: 90
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
  deploy:
    needs: release-build
    if: needs.release-build.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
        working-directory: ui_web
      - uses: actions/download-artifact@v5
        with:
          name: portfolio-public-${{ github.sha }}
          path: ui_web/.build/demo
      - run: node scripts/verify_public_artifact.mjs ${{ github.sha }}
        working-directory: ui_web
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ui_web/.build/demo/site
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
      - run: npx playwright install --with-deps chromium
        working-directory: ui_web
      - name: Public seven-page acceptance and exact asset comparison
        id: online
        continue-on-error: true
        run: node scripts/public_demo_browser.mjs '${{ steps.deployment.outputs.page_url }}'
        working-directory: ui_web
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: portfolio-online-${{ github.sha }}
          path: ui_web/.build/demo/browser-online
          include-hidden-files: true
          retention-days: 90
      - uses: actions/download-artifact@v5
        if: steps.online.outcome == 'failure'
        with:
          name: portfolio-v1-rollback
          path: rollback
      - name: Verify recovery bytes
        if: steps.online.outcome == 'failure'
        run: node ui_web/scripts/verify_v1_rollback.mjs rollback/site
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.online.outcome == 'failure'
        with:
          name: github-pages-recovery
          path: rollback/site
      - uses: actions/deploy-pages@v5.0.1
        if: steps.online.outcome == 'failure'
        with:
          artifact_name: github-pages-recovery
      - name: Verify restored V1 URL and exact bytes
        if: steps.online.outcome == 'failure'
        run: node scripts/verify_v1_online.mjs '${{ steps.deployment.outputs.page_url }}'
        working-directory: ui_web
      - uses: actions/upload-artifact@v6
        if: steps.online.outcome == 'failure'
        with:
          name: portfolio-recovery-${{ github.sha }}
          path: ui_web/v1-recovery-online.json
          retention-days: 90
      - name: Record failed V2 acceptance
        if: steps.online.outcome == 'failure'
        run: exit 1
