name: Verified Demo Pages release
on:
  push:
    branches:
      - release/demo-pages
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui_web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require release branch and approved main history
        working-directory: .
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$RELEASE_REF" = refs/heads/release/demo-pages
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run demo:release-check
      - uses: actions/upload-artifact@v6
        with:
          name: verified-demo
          path: ui_web/.build/demo/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: release-evidence
          path: ui_web/.build/demo-release.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: demo-receipt
          path: ui_web/.build/demo-receipt.json
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: build
    if: github.ref == 'refs/heads/release/demo-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: verified-demo
          path: ui_web/.build/demo
      - uses: actions/download-artifact@v7
        with:
          name: demo-receipt
          path: ui_web/.build
      - name: Reverify downloaded bytes against confirmed checkout
        run: node ui_web/scripts/demo_artifact.mjs verify ui_web/.build/demo ui_web/.build/demo-receipt.json
      - uses: actions/upload-pages-artifact@v4
        id: pages
        with:
          path: ui_web/.build/demo
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
