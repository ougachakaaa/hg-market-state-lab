[project]
name = "backend-api"
version = "0.1.0"
description = "Repository-wide FastAPI delivery runtime and composition root."
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "backend_api", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = ">=0.141.1,<0.142.0"
uvicorn = ">=0.53.0,<0.54.0"
market-snapshot = { path = "../market-snapshot", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.9.0"
mypy = "^1.14.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend_api", "market_snapshot"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
mypy_path = "src"
