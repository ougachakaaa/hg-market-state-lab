[project]
name = "hg-market-state-lab"
version = "0.1.0"
description = "Prepare, model, and present reproducible market-state data products."
requires-python = ">=3.13,<3.14"
dependencies = [
    "tushare (>=1.4.29,<2.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.5.3,<2.6.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
]

[project.scripts]
lab = "ui_cli.cli:main"

[tool.poetry]
packages = [
    { include = "ui_cli" },
    { include = "lab_config", from = "config/src" },
    { include = "data_lake", from = "data_lake/src" },
    { include = "data_lake", from = "data_lake/providers/tushare/src" },
    { include = "data_lake", from = "data_lake/datasets/tushare_trade_calendar/src" },
    { include = "data_lake", from = "data_lake/datasets/tushare_index_daily/src" },
    { include = "data_lake", from = "data_lake/datasets/tushare_equity_index_futures/src" },
    { include = "data_lake", from = "data_lake/datasets/tushare_equity_index_options/src" },
    { include = "data_snapshot", from = "data_snapshot/src" },
    { include = "market_research", from = "market_research/src" },
    { include = "market_backtesting", from = "market_backtesting/src" },
    { include = "market_statistics", from = "market_statistics/src" },
    { include = "ui_http", from = "ui_http/src" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.9.0"
mypy = "^1.14.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = ["diagnostic: manual-only harness/platform check; requires --diagnostics"]
testpaths = [
    "ui_cli/tests",
    "config/tests",
    "data_lake/tests",
    "data_lake/providers/tushare/tests",
    "data_lake/datasets/tushare_index_daily/tests",
    "data_lake/datasets/tushare_equity_index_futures/tests",
    "data_lake/datasets/tushare_equity_index_options/tests",
    "data_lake/datasets/tushare_trade_calendar/tests",
    "data_snapshot/tests",
    "market_research/tests",
    "market_backtesting/tests",
    "market_statistics/tests",
    "ui_http/tests",
    "workbench/tests",
]
pythonpath = [
    "config/src",
    "data_lake/src",
    "data_lake/providers/tushare/src",
    "data_lake/datasets/tushare_index_daily/src",
    "data_lake/datasets/tushare_equity_index_futures/src",
    "data_lake/datasets/tushare_equity_index_options/src",
    "data_lake/datasets/tushare_trade_calendar/src",
    "data_snapshot/src",
    "market_research/src",
    "market_backtesting/src",
    "market_statistics/src",
    "ui_http/src",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [
    "config/src",
    "config/tests",
    "data_lake/src",
    "data_lake/providers/tushare/src",
    "data_lake/tests",
    "data_lake/providers/tushare/tests",
    "data_lake/datasets/tushare_index_daily/src",
    "data_lake/datasets/tushare_equity_index_futures/src",
    "data_lake/datasets/tushare_equity_index_options/src",
    "data_lake/datasets/tushare_trade_calendar/src",
    "data_lake/datasets/tushare_index_daily/tests",
    "data_lake/datasets/tushare_equity_index_futures/tests",
    "data_lake/datasets/tushare_equity_index_options/tests",
    "data_lake/datasets/tushare_trade_calendar/tests",
    "ui_cli",
    "ui_cli/tests",
    "data_snapshot/src",
    "data_snapshot/tests",
    "ui_http/src",
    "ui_http/tests",
    "ui_http/scripts",
    "market_research/tests",
    "market_backtesting/tests",
    "market_statistics/tests",
    "market_research/src",
    "market_backtesting/src",
    "market_statistics/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ui_http", "data_lake", "ui_cli", "market_research", "market_backtesting", "market_statistics", "data_snapshot", "lab_config"]

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
exclude = ['(^|/)conftest\.py$']
files = [
    "config/src",
    "config/tests",
    "data_lake/src",
    "data_lake/providers/tushare/src",
    "data_lake/tests",
    "data_lake/providers/tushare/tests",
    "data_lake/datasets/tushare_index_daily/src",
    "data_lake/datasets/tushare_equity_index_futures/src",
    "data_lake/datasets/tushare_equity_index_options/src",
    "data_lake/datasets/tushare_trade_calendar/src",
    "data_lake/datasets/tushare_index_daily/tests",
    "data_lake/datasets/tushare_equity_index_futures/tests",
    "data_lake/datasets/tushare_equity_index_options/tests",
    "data_lake/datasets/tushare_trade_calendar/tests",
    "ui_cli",
    "data_snapshot/src",
    "data_snapshot/tests",
    "ui_http/src",
    "ui_http/tests",
    "ui_http/scripts",
    "market_research/tests",
    "market_backtesting/tests",
    "market_statistics/tests",
    "market_research/src",
    "market_backtesting/src",
    "market_statistics/src",
]
mypy_path = [
    "config/src",
    "market_research/src",
    "market_backtesting/src",
    "market_statistics/src",
    "data_snapshot/tests",
    "ui_http/tests",
    "market_research/tests",
    "market_backtesting/tests",
    "market_statistics/tests",
    "data_lake/src",
    "data_lake/providers/tushare/src",
    "data_lake/datasets/tushare_index_daily/src",
    "data_lake/datasets/tushare_equity_index_futures/src",
    "data_lake/datasets/tushare_equity_index_options/src",
    "data_lake/datasets/tushare_trade_calendar/src",
    "data_snapshot/src",
    "ui_http/src",
]

[[tool.mypy.overrides]]
module = ["tushare", "tushare.*", "pandas", "pandas.*"]
ignore_missing_imports = true
