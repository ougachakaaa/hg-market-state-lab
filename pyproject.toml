[project]
name = "hg-market-state-lab"
version = "0.1.0"
description = "Prepare, model, and present reproducible market-state data products."
requires-python = ">=3.13,<3.14"
dependencies = [
    "tushare (>=1.4.29,<2.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
]

[project.scripts]
lab = "lab.cli:main"

[tool.poetry]
packages = [
    { include = "lab" },
    { include = "data_lake", from = "data-lake/src" },
    { include = "data_lake", from = "data-lake/datasets/tushare_trade_calendar/src" },
    { include = "market_snapshot", from = "market-snapshot/src" },
    { include = "backend_api", from = "backend-api/src" },
    { include = "market_research", from = "market-research/src" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.9.0"
mypy = "^1.14.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = [
    "lab/tests",
    "data-lake/tests",
    "data-lake/datasets/tushare_trade_calendar/tests",
    "market-snapshot/tests",
    "market-research/tests",
    "backend-api/tests",
]
pythonpath = [
    "data-lake/src",
    "data-lake/datasets/tushare_trade_calendar/src",
    "market-snapshot/src",
    "market-research/src",
    "backend-api/src",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [
    "data-lake/src",
    "data-lake/tests",
    "data-lake/datasets/tushare_trade_calendar/src",
    "data-lake/datasets/tushare_trade_calendar/tests",
    "lab",
    "lab/tests",
    "market-snapshot/src",
    "market-snapshot/tests",
    "market-snapshot/scripts",
    "backend-api/src",
    "backend-api/tests",
    "backend-api/scripts",
    "market-research/src",
    "market-research/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend_api", "data_lake", "lab", "market_research", "market_snapshot"]

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
files = [
    "data-lake/src",
    "data-lake/tests",
    "data-lake/datasets/tushare_trade_calendar/src",
    "data-lake/datasets/tushare_trade_calendar/tests",
    "lab",
    "market-snapshot/src",
    "market-snapshot/tests",
    "market-snapshot/scripts",
    "backend-api/src",
    "backend-api/tests",
    "backend-api/scripts",
    "market-research/src",
    "market-research/tests",
]
mypy_path = [
    "data-lake/src",
    "data-lake/datasets/tushare_trade_calendar/src",
    "market-snapshot/src",
    "market-research/src",
    "backend-api/src",
]

[[tool.mypy.overrides]]
module = ["tushare", "tushare.*", "pandas", "pandas.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
