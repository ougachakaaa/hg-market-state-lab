[project]
name = "daily-market-snapshot"
version = "0.1.0"
description = "Collect market data and turn it into a fixed Daily Market Snapshot for GPT analysis."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["tushare (>=1.4.29,<2.0.0)", "python-dotenv (>=1.2.3,<2.0.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.9.0"
mypy = "^1.14.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# scripts/ and tests/ are flat directories imported directly, so ruff cannot
# infer these as first-party on its own.
known-first-party = [
    "_common",
    "fake_source",
    "fetch_csi1000_index_history",
    "fetch_im_futures_basic",
    "fetch_im_futures_daily",
    "fetch_index_daily",
    "fetch_mo_option_basic",
    "fetch_mo_option_daily",
    "fetch_stock_daily",
]

[tool.mypy]
python_version = "3.13"
files = ["scripts", "tests"]

[[tool.mypy.overrides]]
# Neither the Tushare SDK nor pandas ships type hints or a py.typed marker.
# The project's own scripts and tests stay fully checked; only these imports
# are treated as untyped.
module = ["tushare", "tushare.*", "pandas", "pandas.*"]
ignore_missing_imports = true
