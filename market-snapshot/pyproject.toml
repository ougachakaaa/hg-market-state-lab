[project]
name = "daily-market-snapshot"
version = "0.1.0"
description = "Collect market data and turn it into a fixed Daily Market Snapshot for GPT analysis."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["tushare (>=1.4.29,<2.0.0)", "python-dotenv (>=1.2.3,<2.0.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.9.0"
mypy = "^1.14.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project source lives under src/ and Poetry stays package-mode = false, so
# the tests import ``daily_market_snapshot`` from there.
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["daily_market_snapshot"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Neither the Tushare SDK nor pandas ships type hints or a py.typed marker.
# The project's own modules and tests stay fully checked; only these imports
# are treated as untyped.
module = ["tushare", "tushare.*", "pandas", "pandas.*"]
ignore_missing_imports = true

